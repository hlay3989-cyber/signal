<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Termux</title>
<style>
  html, body { margin: 0; background: #000; color: #e8e8e8; }
  body {
    font-family: "DejaVu Sans Mono", "Droid Sans Mono", Menlo, Consolas, "Courier New", monospace;
    font-size: 15px; line-height: 1.35;
    padding: 10px 10px 70px;
  }
  #out div { white-space: pre-wrap; word-break: break-word; min-height: 1.35em; }
  .g { color: #3ddc6a; }
  .r { color: #ff5f56; }
  .y { color: #f5d94a; }
  .d { color: #8a8a8a; }
  a { color: #5fb0ff; }
  #row { display: none; align-items: baseline; }
  #ps { color: #3ddc6a; white-space: pre; }
  #t {
    flex: 1; min-width: 0; margin-left: 6px; padding: 0;
    background: transparent; border: 0; outline: 0;
    color: #e8e8e8; font: inherit; caret-color: #e8e8e8;
  }
  #keys {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; background: #1b1b1b; border-top: 1px solid #333;
  }
  #keys span { flex: 1; text-align: center; padding: 14px 0; font-size: 13px; color: #cfcfcf; }
</style>
</head>
<body>
<div id="out" aria-live="polite"></div>
<div id="row"><span id="ps">S@2040:~ $</span><input id="t" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="input"></div>
<div id="keys"><span>ESC</span><span>/</span><span>-</span><span>HOME</span><span>&#8593;</span><span>END</span><span>PGUP</span></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var out = $("out"), row = $("row"), input = $("t");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DELAY = reduce ? 0 : 170;

  // تاريخ ووقت النهارده عند اللاعب، بس السنة دايماً 2040
  function stamp() {
    var d = new Date();
    return pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-2040 " +
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  function add(text, cls) {
    var d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = text;
    out.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
    return d;
  }

  function play(list, done) {
    var i = 0;
    (function next() {
      if (i >= list.length) { if (done) done(); return; }
      var item = list[i++];
      var text = typeof item.t === "function" ? item.t() : item.t;
      add(text, item.c);
      setTimeout(next, item.w === undefined ? DELAY : item.w);
    })();
  }


  // بيكتب الرسالة حرف حرف، وساعات يغلط ويمسح، زي واحد بيكتب فعلاً
  function typeLines(lines, done, noPause) {
    if (reduce) { for (var k = 0; k < lines.length; k++) add(lines[k]); return done(); }
    var LET = "qwertyuiopasdfghjklzxcvbnm", li = 0;
    (function nextLine() {
      if (li >= lines.length) return done();
      var text = lines[li++], d = add("");
      if (text === "") return setTimeout(nextLine, 450);
      var buf = "", i = 0, fixed = false;
      function show(cursor) {
        d.textContent = buf + (cursor === false ? "" : "\u2588");
        window.scrollTo(0, document.body.scrollHeight);
      }
      show();
      (function step() {
        if (i >= text.length) { show(false); return setTimeout(nextLine, noPause ? 0 : 650 + Math.random() * 500); }
        var ch = text.charAt(i);
        if (!fixed && i > 2 && /[a-z]/.test(ch) && Math.random() < 0.03) {
          var wrong = LET.charAt(Math.floor(Math.random() * 26));
          if (wrong === ch) wrong = (ch === "e" ? "r" : "e");
          buf += wrong; show();
          return setTimeout(function () {
            buf = buf.slice(0, -1); show(); fixed = true;
            setTimeout(step, 170);
          }, 380);
        }
        fixed = false;
        buf += ch; i++; show();
        var wait = 22 + Math.random() * 30;
        if (ch === ".") wait += 350; else if (ch === ",") wait += 160;
        setTimeout(step, wait);
      })();
    })();
  }

  var FILES = {
    "readme.txt": [
      "if you can read this, the relay worked.",
      "",
      "the radio can only send me one thing at a time.",
      "i have been sending you a sound. it isn't speech.",
      "you can't hear what it says. you have to look at it."
    ],
    "profile.txt": [
      "name:       S (the rest is unreadable)",
      "age:        31",
      "work:       radio technician",
      "lives:      alone, above a repair shop",
      "last seen:  a street near the market, the morning of the flash",
      "status:     unknown"
    ],
    "log.txt": [
      "[day 1] woke up. a workshop. a radio on the desk.",
      "[day 1] everything outside is grey. no wind. no birds.",
      "[day 2] i remember the street. the flash. falling.",
      "[day 2] i don't remember hitting the ground.",
      "[day 3] the radio only picks up one thing: you.",
      "[day 3] every time i send a signal my hands feel heavier.",
      "[day 4] i think i'm not here. i think i'm still lying on that street.",
      "[day 4] i can only send the same message. i can't tell if anyone hears it.",
      "[day 5] found a notebook in the drawer. the handwriting is mine. i don't remember writing it.",
      "[day 6] the radio hums when i sleep. i don't think i sleep.",
      "[day 7] there's a door under the clock. it's warm. i can't open it.",
      "[day 7] if you find this, say it back to me."
    ]
  };

  function run(cmd) {
    var raw = cmd.replace(/^\s+|\s+$/g, "");
    if (!raw) return;
    var parts = raw.split(/\s+/), name = parts[0].toLowerCase(), arg = (parts[1] || "").toLowerCase();

    // the answer: whatever the sound spells, typed as a command
    if (raw.toLowerCase().replace(/[^a-z]/g, "") === "wakeup") return ending();

    if (name === "help") {
      add("commands: help  ls  cat <file>  get <file>  clear");
    } else if (name === "ls") {
      add("readme.txt  log.txt  profile.txt  voice.wav");
    } else if (name === "cat") {
      if (!arg) add("cat: missing file operand", "r");
      else if (FILES[arg]) { for (var i = 0; i < FILES[arg].length; i++) add(FILES[arg][i]); }
      else if (arg === "voice.wav") add("cat: voice.wav: binary file. try: get voice.wav", "y");
      else add("cat: " + parts[1] + ": No such file or directory", "r");
    } else if (name === "get") {
      if (arg === "voice.wav") {
        var d = add("");
        var a = document.createElement("a");
        a.href = "../voice.wav"; a.download = "voice.wav"; a.textContent = "voice.wav (431 KB) - tap to download";
        d.appendChild(a);
      } else add("get: " + (parts[1] || "") + ": No such file", "r");
    } else if (name === "clear") {
      out.innerHTML = "";
    } else if (name === "whoami") {
      add("s");
    } else {
      add("bash: " + parts[0] + ": command not found", "r");
    }
  }

  var mode = "shell";
  var SYM = "#$%&*@!?<>/|{}[]=+~^;:01\u2591\u2592\u2593\u2588\u258c\u2590";
  var NAMES = ["blast_2026.dat", "street_cam_07.mp4", "heartbeat.wav", "ceiling_lights.jpg", "room_204.log",
    "voice_02.wav", "last_words.txt", "S_vitals.log", "relay_core.so", "mem_0x7f3a9c.bin", "wake.bin",
    "pulse.dat", "corridor.jpg", "monitor_beep.wav", "sync_table.db", "frame_0113.raw"];
  var DIRS = ["/sys/core/", "/usr/lib/", "/data/relay/", "/var/log/", "/mnt/ward/", "/tmp/"];
  var CODE = ["if (ptr == NULL) goto fail;", "for (i = 0; i < n; i++) buf[i] ^= key;", "memcpy(dst, src, 0x400);",
    "return -EINVAL;", "while (1) { sleep(1); }", "int sync_time(struct clk *c)", "void *p = malloc(len);",
    "#include <relay.h>", "0x7f3a9c: mov eax, ebx", "static int carrier = 0;", "if (!ack) retry(3);"];
  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function hex(n) { var s = ""; for (var i = 0; i < n; i++) s += (rnd(256) + 256).toString(16).slice(1) + " "; return s; }
  function junk(n) { var s = ""; for (var i = 0; i < n; i++) s += SYM.charAt(rnd(SYM.length)); return s; }

  function fileLine() {
    var r = Math.random();
    if (r < 0.42) {
      var fill = rnd(13), bar = new Array(fill + 1).join("#") + new Array(13 - fill).join("-");
      return { t: "[recv] " + pick(DIRS) + pick(NAMES) + "  [" + bar + "]  " + (rnd(90) / 10 + 0.1).toFixed(1) + "MB" };
    } else if (r < 0.68) {
      return { t: "0x" + (rnd(65535) + 65536).toString(16).slice(1) + "  " + hex(16), c: "d" };
    } else if (r < 0.82) {
      return { t: pick(CODE), c: "g" };
    } else if (r < 0.9) {
      return { t: "[!!] checksum mismatch: " + pick(NAMES), c: "r" };
    } else {
      var s = ""; for (var i = 0; i < 44; i++) s += B64.charAt(rnd(64));
      return { t: s, c: "y" };
    }
  }

  // الكلام اللي اتكتب بيتلخبط تدريجياً زي إشارة بتبوظ
  function corruptLine(d, done) {
    var base = d.textContent, ticks = 0, POOL = "0123456789abcdef" + SYM;
    var iv = setInterval(function () {
      ticks++;
      var p = Math.min(1, ticks / 34), s = "";
      for (var i = 0; i < base.length; i++) {
        s += (Math.random() < p ? POOL.charAt(rnd(POOL.length)) : base.charAt(i));
      }
      if (ticks > 10) s += junk(Math.min((ticks - 10) * 3, 70));
      d.textContent = s;
      if (ticks >= 44) { clearInterval(iv); done(); }
    }, 45);
  }

  // شريط تحميل
  function loadingBar(done) {
    var bar = add("[..] loading [------------]   0%"), pct = 0, stalled = false;
    (function tick() {
      pct += reduce ? 100 : 2 + rnd(7);
      if (!stalled && pct >= 68 && !reduce) { pct = 68; stalled = true; }
      if (pct > 100) pct = 100;
      var n = Math.floor(pct * 12 / 100);
      bar.textContent = "[..] loading [" + new Array(n + 1).join("#") + new Array(13 - n).join("-") + "] " +
        (pct < 10 ? "  " : pct < 100 ? " " : "") + pct + "%";
      if (pct >= 100) return setTimeout(done, 350);
      setTimeout(tick, stalled && pct === 68 ? 900 : 110 + rnd(90));
      if (stalled && pct === 68) stalled = "done";
    })();
  }

  // ملفات كتير بتنزل ورا بعضها، وبتزيد سرعة
  // سطرين ثابتين مخبيين وسط الملفات: hex فيه ROOM 204، وbase64 فيه /ward/
  var SPECIAL = {
    6:  { t: "0x00a4  3f 91 52 4f 4f 4d 20 32 30 34 7b c2 0e 55 91 1d", c: "d" },
    13: { t: "q8Zr0TkLpV2xN4aFL3dhcmQvHn7QeYb2sUm9cXw1Zj5R", c: "y" }
  };

  function flood(done) {
    var n = 0, TOTAL = 320, delay = 120;
    (function tick() {
      var burst = n < 30 ? 1 : n < 90 ? 2 : 4;
      for (var b = 0; b < burst; b++) { var L = SPECIAL[n] || fileLine(); add(L.t, L.c); n++; }
      delay = Math.max(16, delay * 0.965);
      if (n >= TOTAL) return done();
      setTimeout(tick, reduce ? 0 : delay);
    })();
  }

  // قطع الاتصال: من غير أي كلام بعده
  function cut() {
    add("[!!] connection lost", "r");
    setTimeout(function () { out.innerHTML = ""; }, 900);
  }

  // الرد على كلام اللاعب
  function reply(said) {
    var s = said.replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
    if (s.length > 36) s = s.slice(0, 36) + "...";
    play([
      { t: "[..] sending", w: 900 },
      { t: "[ok] delivered", c: "g", w: 1600 },
      { t: "" },
      { t: "S@2040:~ $ nano reply.txt", w: 1100 }
    ], function () {
      typeLines(['you said: "' + s + '". i heard you. the grey is thinning. there\'s light under the d'], function () {
        corruptLine(out.lastElementChild, function () {
          add("");
          loadingBar(function () { flood(cut); });
        });
      }, true);
    });
  }

  function ending() {
    row.style.display = "none";
    mode = "busy";
    play([
      { t: "[ok] message received", c: "g", w: 900 },
      { t: "[..] resyncing", w: 1200 },
      { t: "[..] resyncing", w: 1200 },
      { t: "[!!] signal unstable", c: "y", w: 900 },
      { t: "" },
      { t: "S@2040:~ $ nano msg.txt", w: 1000 }
    ], function () {
      typeLines(["i'm still here. i'm 31. i fix radios for a living.", "", "i was on my way to work when the street went white.", "", "did you hear me?"], function () {
        play([
          { t: "", w: 500 },
          { t: "S@2040:~ $ ./send --to 2026", w: 900 },
          { t: "[..] sending", w: 1500 },
          { t: function () { return "[ok] sent " + stamp(); }, c: "g", w: 900 },
          { t: "" }
        ], function () {
          mode = "reply";
          $("ps").textContent = "reply>";
          row.style.display = "flex";
          input.focus();
          window.scrollTo(0, document.body.scrollHeight);
        });
      });
    });
  }

  function submit() {
    var v = input.value;
    if (mode === "reply") {
      if (!v.replace(/\s+/g, "")) return;
      input.value = ""; row.style.display = "none"; mode = "done";
      add("reply> " + v);
      return reply(v);
    }
    if (mode !== "shell") return;
    add("S@2040:~ $ " + v);
    input.value = "";
    run(v);
    window.scrollTo(0, document.body.scrollHeight);
  }

  input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  document.addEventListener("click", function () { if (row.style.display !== "none") input.focus(); });

  play([
    { t: "~ $ ./relay --open", w: 500 },
    { t: "[..] opening relay" },
    { t: "[ok] relay open", c: "g" },
    { t: function () { return "[..] local time " + stamp(); } },
    { t: "type help", c: "d" },
    { t: "" }
  ], function () {
    row.style.display = "flex";
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
  });
})();
</script>
</body>
</html>
